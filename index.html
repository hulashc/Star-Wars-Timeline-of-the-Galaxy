<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Star Wars Comics Deck</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --accent: #DADADA;
      --accent-light: #E3DACC;
      --border: rgba(255,255,240,0.7);
      --card-bg: #161616;
      --green: #31F68D;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000000;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      color: var(--accent);
    }

    /* ===== STAGE ===== */
    .stage {
      position: fixed; top: 90px; left: 0; right: 0; bottom: 0;
      pointer-events: none;
    }

    .rolodex-container {
      position: relative; width: 100%; height: 100%;
      perspective: 1700px; perspective-origin: 50% 20%;
    }

    .card-stack {
      position: absolute; top: 48%; left: 50%;
      width: 36vw; max-width: 460px; height: 76vh;
      transform-style: preserve-3d;
      transform: translate(-50%, -50%);
    }

    .card {
      position: absolute; inset: 0;
      transform-style: preserve-3d;
      transform-origin: center center;
      will-change: transform, opacity;
      cursor: pointer;
      pointer-events: auto;
    }

    .card-inner {
      width: 100%; height: 100%;
      border-radius: 4px;
      overflow: hidden; background: #000000;
      box-shadow: 0 32px 60px rgba(0,0,0,0.85), 0 0 0 1px rgba(255,255,240,0.12);
      border: 1px solid var(--border);
      position: relative;
      transition: border-color .3s;
    }
    .card:hover .card-inner { border-color: var(--green); }

    .card-inner img {
      width: 100%; height: 100%;
      object-fit: contain;
      filter: brightness(0.92) contrast(1.15);
      display: block;
    }

    .cover-fallback {
      width: 100%; height: 100%;
      display: flex; align-items: flex-end; justify-content: center;
      padding: 24px 34px;
      font-size: clamp(18px, 2vw, 28px); font-weight: 900;
      letter-spacing: .05em; text-transform: uppercase;
      color: var(--accent-light);
      position: relative;
    }
    .cover-fallback::before {
      content: ''; position: absolute; inset: 0;
      background: repeating-linear-gradient(
        45deg, transparent, transparent 2px,
        rgba(255,255,255,0.015) 2px, rgba(255,255,255,0.015) 4px
      );
    }



    /* ===== INFO PANEL ===== */
    .info-panel {
      position: fixed; top: 28px; left: 0; right: 0;
      height: 62px; z-index: 1400;
      display: flex; align-items: center;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      pointer-events: auto;
      overflow: hidden;
    }
    .info-card {
      display: flex; align-items: center;
      width: 100%; height: 100%;
      gap: 16px; padding: 0 20px;
    }
    .info-era-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 10px; border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 9px; letter-spacing: .16em; text-transform: uppercase;
      flex-shrink: 0; opacity: .9;
      cursor: pointer; transition: opacity .2s, border-color .2s;
      user-select: none;
    }
    .info-era-pill:hover { opacity: 1; border-color: var(--green); }
    .info-era-pill::after {
      content: '\21C4'; font-size: 10px; opacity: .6;
      transition: opacity .2s;
    }
    .info-era-pill:hover::after { opacity: 1; }
    .info-title {
      font-size: 15px; font-weight: 800;
      letter-spacing: .06em; text-transform: uppercase;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      min-width: 0;
    }
    .info-subtitle {
      font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
      opacity: .65; flex-shrink: 0;
    }
    .info-meta { display: none; }
    .info-summary { display: none; }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 2000;
      background: rgba(10,10,12,0.97);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity .35s;
      padding: 20px;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }

    .modal-content {
      background: radial-gradient(circle at top, rgba(255,255,240,0.04), #000000 95%);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 620px; width: 100%; max-height: 90vh;
      overflow-y: auto;
      display: flex; flex-direction: column;
      box-shadow: 0 40px 80px rgba(0,0,0,0.95), 0 0 0 1px rgba(255,255,240,0.1);
      transform: scale(0.92) translateY(20px);
      transition: transform .35s cubic-bezier(.22,1,.36,1);
    }
    .modal-overlay.open .modal-content { transform: scale(1) translateY(0); }

    .modal-close {
      position: absolute; top: 12px; right: 14px;
      background: none; border: none; color: var(--accent);
      font-size: 22px; cursor: pointer; z-index: 10;
      opacity: .7; transition: opacity .2s; line-height: 1;
    }
    .modal-close:hover { opacity: 1; }

    .modal-image {
      width: 100%; height: 300px;
      clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%);
      position: relative; overflow: hidden;
      background: #000000;
    }
    .modal-image img {
      width: 100%; height: 100%; object-fit: contain; display: block;
    }
    .modal-image .cover-fallback {
      align-items: center; font-size: clamp(24px, 4vw, 36px);
      padding: 40px;
    }

    .modal-body { padding: 20px 24px 28px; position: relative; }
    .modal-era {
      display: inline-flex; align-items: center;
      padding: 3px 10px; border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
      margin-bottom: 10px; opacity: .9;
    }
    .modal-title { font-size: 24px; font-weight: 900; letter-spacing: .05em; text-transform: uppercase; color: var(--accent-light); margin-bottom: 2px; }
    .modal-issue { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; opacity: .7; margin-bottom: 16px; }
    .modal-meta { font-size: 12px; line-height: 1.8; opacity: .85; margin-bottom: 16px; }
    .modal-meta strong { font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 11px; }
    .modal-summary { font-size: 13px; line-height: 1.7; opacity: .85; }

    .empty-state {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: rgba(218,218,218,0.4); font-size: 14px; letter-spacing: .1em;
      pointer-events: none; text-align: center;
    }

    /* ===== ERA BAR ===== */
    .era-bar {
      position: fixed; top: 0; left: 0; right: 0;
      height: 28px; z-index: 1500;
      display: flex; align-items: center; justify-content: center;
      gap: 10px;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 700;
      pointer-events: auto;
      user-select: none;
    }
    .era-bar span {
      opacity: 0.3;
      transition: opacity .35s;
      cursor: pointer;
    }
    .era-bar span.active {
      opacity: 1;
      color: var(--green);
    }
    .era-bar .sep {
      opacity: 0.15;
      cursor: default;
    }
    .era-bar .yr {
      font-weight: 400;
      font-size: 8px;
      opacity: 0.4;
      margin-left: 2px;
      cursor: default;
    }
    .era-arrow {
      font-size: 7px;
      opacity: 0.4;
      cursor: default;
      transition: opacity 1s;
      line-height: 1;
    }



    /* ===== RESPONSIVE ===== */
    @media (max-width: 1024px) {
      .card-stack { width: 34vw; max-width: 360px; }
    }

    @media (max-width: 768px) {
      .stage { top: 84px; }
      .info-panel { height: 56px; }
      .info-era-pill { font-size: 8px; padding: 2px 8px; }
      .info-title { font-size: 13px; }
      .info-subtitle { font-size: 9px; }

      .card-stack { width: 50vw; max-width: 320px; height: 55vh; }
      .card-inner img { filter: none; }
      .card-inner { border: none; overflow: visible; }
      .card-inner img { transform: scale(1.1); object-fit: contain; }

      .modal-content { max-width: 100%; border-radius: 8px; }
      .modal-image { height: 200px; clip-path: polygon(0 0, 100% 0, 100% 90%, 0 100%); }
      .modal-body { padding: 16px 18px 22px; }
      .modal-title { font-size: 18px; }
    }

    @media (max-width: 480px) {
      .stage { top: 78px; }
      .info-panel { height: 50px; }
      .info-card { gap: 10px; padding: 0 12px; }
      .info-era-pill { font-size: 7px; padding: 1px 6px; }
      .info-title { font-size: 11px; }
      .info-subtitle { display: none; }
      .card-stack { width: 60vw; max-width: 280px; height: 48vh; }
    }
  </style>
</head>
<body>

  <!-- ===== STAGE ===== -->
  <div class="stage">
    <div class="rolodex-container">
      <div class="card-stack" id="card-stack"></div>
      <div class="empty-state" id="empty-state">No comics match your filter</div>
    </div>
  </div>

  <div class="era-bar" id="era-bar">
    <span class="era-arrow" id="era-arrow-l">◀</span>
    <span class="era-lbl" data-era="0">Legends</span>
    <span class="sep">|</span>
    <span class="era-lbl" data-era="1">Canon</span>
    <span class="era-arrow" id="era-arrow-r">▶</span>
    <span class="yr" id="era-year"></span>
  </div>

  <aside class="info-panel">
    <div class="info-card">
      <div class="info-era-pill" id="info-era-pill"></div>
      <div class="info-title" id="info-title"></div>
      <div class="info-subtitle" id="info-subtitle"></div>
      <div class="info-meta" id="info-meta"></div>
      <div class="info-summary" id="info-summary"></div>
    </div>
  </aside>

  <!-- ===== STAGE ===== -->
  <div class="stage">
    <div class="rolodex-container">
      <div class="card-stack" id="card-stack"></div>
      <div class="empty-state" id="empty-state">No comics match your filter</div>
    </div>
  </div>

  <!-- ===== MODAL ===== -->
  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <button class="modal-close" id="modal-close">&times;</button>
      <div class="modal-image" id="modal-image"></div>
      <div class="modal-body">
        <div class="modal-era" id="modal-era"></div>
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-issue" id="modal-issue"></div>
        <div class="modal-meta" id="modal-meta"></div>
        <div class="modal-summary" id="modal-summary"></div>
      </div>
    </div>
  </div>

  <script src="comics.js"></script>
  <script>
    /* ==========================================================
       SECTION 1: DATA — loaded from comics.js via <script> tag
       ========================================================== */

    /* ==========================================================
       SECTION 2: STATE & DOM REFS
       ========================================================== */

    const WINDOW_RADIUS = window.innerWidth < 768 ? 4 : 7;
    const IS_MOBILE = window.innerWidth < 768;

    let loadedData = null;
    const eras = ['legends', 'canon'];
    let currentEraIndex = 0;
    let currentEra = eras[0];
    let virtualIndex = parseFloat(localStorage.getItem('sw-index')) || 0;
    let filteredData = [];
    let cards = [];
    let maxIndex = 0;
    let animating = true;

    const cardStack = document.getElementById('card-stack');
    const emptyState = document.getElementById('empty-state');
    const infoEra = document.getElementById('info-era-pill');
    const infoTitle = document.getElementById('info-title');
    const infoSub = document.getElementById('info-subtitle');
    const infoMeta = document.getElementById('info-meta');
    const infoSummary = document.getElementById('info-summary');
    const modal = document.getElementById('modal');
    const modalClose = document.getElementById('modal-close');
    const modalImage = document.getElementById('modal-image');
    const modalEra = document.getElementById('modal-era');
    const modalTitle = document.getElementById('modal-title');
    const modalIssue = document.getElementById('modal-issue');
    const modalMeta = document.getElementById('modal-meta');
    const modalSummary = document.getElementById('modal-summary');

    /* ==========================================================
       SECTION 3: HELPERS
       ========================================================== */

    function slugify(text) {
      return text.toLowerCase()
        .replace(/[^\w\s'-]/g, '')
        .replace(/[\s-]+/g, '-')
        .replace(/^-|-$/g, '');
    }

    function getAbsoluteYear(c) {
      return c.era === 'BBY' ? -c.year : c.year;
    }

    function getFallbackStyle(title) {
      let hash = 0;
      for (let i = 0; i < title.length; i++) {
        hash = title.charCodeAt(i) + ((hash << 5) - hash);
      }
      const hue = Math.abs(hash % 360);
      return `linear-gradient(135deg, hsl(${hue}, 55%, 14%), hsl(${(hue + 40) % 360}, 50%, 7%))`;
    }

    function handleImageError(img, alt) {
      if (img.dataset.fallback === 'true') return;
      img.dataset.fallback = 'true';
      img.style.display = 'none';
      const fb = document.createElement('div');
      fb.className = 'cover-fallback';
      fb.style.background = getFallbackStyle(alt);
      fb.textContent = alt;
      img.parentNode.insertBefore(fb, img);
    }

    function coverSlug(comic) {
      const ageSlug = slugify(comic.age);
      const sub = comic.title.includes(':') ? comic.title.split(':')[1].trim() : comic.title;
      const subSlug = slugify(sub);
      const issueSlug = slugify(comic.issue);
      return `${ageSlug}/${subSlug}/${issueSlug}`;
    }
    function createCoverImage(comic, container) {
      const img = document.createElement('img');
      const slug = coverSlug(comic);
      img.src = `covers/${slug}.jpg`;
      img.alt = comic.title;
      img.loading = 'lazy';
      img.onerror = function () { handleImageError(this, comic.title); };
      container.appendChild(img);
    }

    /* ==========================================================
       SECTION 4: DATA LOADING + FILTERING
       ========================================================== */

    function initApp() {
      loadedData = COMICS_DATA;
      reapplyFilters();
      requestAnimationFrame(animate);
    }

    function getFilteredData() {
      return [...loadedData[currentEra]].reverse();
    }

    /* ==========================================================
       SECTION 5: VIRTUAL WINDOW RENDERING
       ========================================================== */

    function createCardElement(comic, index) {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.index = index;

      const inner = document.createElement('div');
      inner.className = 'card-inner';
      createCoverImage(comic, inner);
      card.appendChild(inner);
      card.addEventListener('click', () => openModal(comic));
      cardStack.appendChild(card);
      return card;
    }

    function renderWindow() {
      const center = Math.round(virtualIndex);
      const start = Math.max(0, center - WINDOW_RADIUS);
      const end = Math.min(filteredData.length - 1, center + WINDOW_RADIUS);

      if (filteredData.length === 0) {
        cardStack.innerHTML = '';
        emptyState.style.display = 'block';
        cards = [];
        maxIndex = 0;
        return;
      }
      emptyState.style.display = 'none';

      const existing = new Set();
      Array.from(cardStack.children).forEach(el => {
        const idx = parseInt(el.dataset.index);
        if (idx >= start && idx <= end) {
          existing.add(idx);
        } else {
          el.remove();
        }
      });

      for (let i = start; i <= end; i++) {
        if (existing.has(i)) continue;
        createCardElement(filteredData[i], i);
      }

      const children = Array.from(cardStack.children)
        .sort((a, b) => parseInt(a.dataset.index) - parseInt(b.dataset.index));
      children.forEach((el, i) => { el.style.zIndex = children.length - i; });
      cards = children;
      maxIndex = filteredData.length - 1;
    }

    function reapplyFilters() {
      filteredData = getFilteredData();
      if (virtualIndex > filteredData.length - 1) virtualIndex = 0;
      if (virtualIndex < 0) virtualIndex = 0;
      lastRenderedCenter = -1;
      renderWindow();
      updateInfo();
    }

    function currentComic() {
      const idx = Math.round(virtualIndex);
      return filteredData[idx] || null;
    }

    function switchEra(newIndex) {
      if (newIndex === currentEraIndex || !loadedData[eras[newIndex]]) return;
      currentEraIndex = newIndex;
      currentEra = eras[currentEraIndex];
      virtualIndex = 0;
      scrollVelocity = 0;
      cardStack.style.opacity = '0.3';
      reapplyFilters();
      updateEraBar();
      requestAnimationFrame(() => { cardStack.style.opacity = ''; });
    }

    /* ==========================================================
       SECTION 11: ANIMATION LOOP
       ========================================================== */

    let lastRenderedCenter = -1;

    function animate() {
      if (!animating) {
        requestAnimationFrame(animate);
        return;
      }

      if (!isTouching) {
        scrollVelocity *= 0.82;
        if (Math.abs(scrollVelocity) < 0.001) scrollVelocity = 0;
        virtualIndex += scrollVelocity;
        virtualIndex = Math.max(0, Math.min(maxIndex, virtualIndex));
        const snapTarget = Math.round(virtualIndex);
        virtualIndex += (snapTarget - virtualIndex) * (IS_MOBILE ? 0.15 : 0.08);
      }

      const center = Math.round(virtualIndex);
      if (center !== lastRenderedCenter) {
        lastRenderedCenter = center;
        renderWindow();
        if (!isTouching && IS_MOBILE) {
          if (navigator.vibrate) navigator.vibrate(8);
        }
      }

      const baseTilt = -18;
      const deckSpreadZ = 28;
      const deckSpreadY = -6;

      cards.forEach(card => {
        const i = parseInt(card.dataset.index);
        const offset = i - virtualIndex;
        let rotateX, translateY, translateZ, opacity;

        if (offset < -1.2) {
          rotateX = 90; translateY = 520; translateZ = -280; opacity = 0;
        } else if (offset < 0) {
          const t = 1 + offset;
          rotateX = baseTilt + (1 - t) * 110;
          translateY = t * -24 + (1 - t) * 280;
          translateZ = t * 90 + (1 - t) * -220;
          opacity = t;
        } else {
          const depth = Math.min(offset, 6);
          translateZ = -depth * deckSpreadZ;
          translateY = depth * deckSpreadY;
          rotateX = baseTilt;
          opacity = 1 - depth * 0.12;

          if (offset < 0.5) {
            const lift = (0.5 - offset) * 2;
            translateZ += lift * 70;
            translateY -= lift * 18;
          }
        }

        card.style.transform = `rotateX(${rotateX}deg) translateZ(${translateZ}px) translateY(${translateY}px)`;
        card.style.opacity = opacity;
      });

      updateInfo();
      if (Math.abs(scrollVelocity) < 0.01 && Math.abs(virtualIndex - Math.round(virtualIndex)) < 0.01) {
        localStorage.setItem('sw-index', Math.round(virtualIndex));
      }
      requestAnimationFrame(animate);
    }

    /* ==========================================================
       SECTION 7: INFO PANEL
       ========================================================== */

    function updateInfo() {
      const c = currentComic();
      if (!c) {
        infoEra.textContent = '';
        infoTitle.textContent = 'No results';
        infoSub.textContent = '';
        infoMeta.innerHTML = '';
        infoSummary.textContent = 'Try adjusting your search or filter.';
        return;
      }
      infoEra.textContent = `${currentEra.toUpperCase()} · ${c.year} ${c.era}`;
      infoTitle.textContent = c.title;
      infoSub.textContent = c.issue;
      infoMeta.innerHTML = `
        <div><strong>PUBLISHER</strong> · ${c.publisher}</div>
        <div><strong>FORMAT</strong> · ${c.format}</div>
        <div><strong>RELEASE</strong> · ${c.release}</div>
        <div><strong>TIMELINE</strong> · ${c.year} ${c.era}</div>
      `;
      infoSummary.textContent = c.note;
      updateEraBar();
    }

    /* ==========================================================
       SECTION 8: MODAL
       ========================================================== */

    function openModal(comic) {
      animating = false;

      modalImage.innerHTML = '';
      createCoverImage(comic, modalImage);

      modalEra.textContent = `${currentEra.toUpperCase()} · ${comic.year} ${comic.era}`;
      modalTitle.textContent = comic.title;
      modalIssue.textContent = comic.issue;
      modalMeta.innerHTML = `
        <div><strong>PUBLISHER</strong> · ${comic.publisher}</div>
        <div><strong>FORMAT</strong> · ${comic.format}</div>
        <div><strong>RELEASE</strong> · ${comic.release}</div>
        <div><strong>TIMELINE</strong> · ${comic.year} ${comic.era}</div>
      `;
      modalSummary.textContent = comic.note;

      modal.classList.add('open');
    }

    function closeModal() {
      modal.classList.remove('open');
      animating = true;
    }

    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('open')) closeModal(); });

    /* ==========================================================
       SECTION 10: INPUT HANDLING
       ========================================================== */

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch (e) {}
      }
    }
    function audioTick() {
      initAudio();
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const t = audioCtx.currentTime, d = 0.04;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sine'; osc.frequency.value = 800;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.06, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.001, t + d);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(t + d);
      } catch (e) {}
    }
    function hapticTick() {
      if (navigator.vibrate) { navigator.vibrate(8); return; }
      try {
        const id = 'ht-' + Date.now();
        const inp = document.createElement('input');
        inp.type = 'checkbox'; inp.setAttribute('switch', '');
        inp.id = id; inp.style.cssText = 'position:fixed;opacity:0;pointer-events:none;width:1px;height:1px';
        const lbl = document.createElement('label');
        lbl.htmlFor = id; lbl.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
        lbl.appendChild(inp); document.body.appendChild(lbl);
        lbl.click(); lbl.remove();
      } catch (e) { audioTick(); }
    }

    let scrollVelocity = 0;
    let isTouching = false;
    let touchAnchorY = 0;
    let touchAnchorX = 0;
    let touchAnchorIndex = 0;
    let touchLastY = 0;
    let flickVelocity = 0;
    let lastHapticCenter = -1;

    const TOUCH_SENSITIVITY = 0.01;
    const SWIPE_THRESHOLD = 30;

    window.addEventListener('wheel', (e) => {
      scrollVelocity += e.deltaY * 0.002;
    }, { passive: true });

    window.addEventListener('touchstart', (e) => {
      if (e.target.closest('.info-panel') || e.target.closest('.modal-overlay')) return;
      initAudio();
      touchAnchorX = e.touches[0].clientX;
      touchAnchorY = e.touches[0].clientY;
      touchLastY = touchAnchorY;
      touchAnchorIndex = virtualIndex;
      isTouching = true;
      scrollVelocity = 0;
      flickVelocity = 0;
      lastHapticCenter = Math.round(virtualIndex);
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!isTouching) return;
      const x = e.touches[0].clientX;
      const y = e.touches[0].clientY;
      const deltaX = touchAnchorX - x;
      const deltaY = touchAnchorY - y;
      const frameDelta = touchLastY - y;
      touchLastY = y;

      if (Math.abs(deltaX) > Math.abs(deltaY) * 1.5 && Math.abs(deltaX) > SWIPE_THRESHOLD) {
        if (deltaX < 0 && currentEraIndex < eras.length - 1) {
          switchEra(currentEraIndex + 1);
        } else if (deltaX > 0 && currentEraIndex > 0) {
          switchEra(currentEraIndex - 1);
        }
        isTouching = false;
        return;
      }

      virtualIndex = touchAnchorIndex + deltaY * TOUCH_SENSITIVITY;
      virtualIndex = Math.max(0, Math.min(maxIndex, virtualIndex));
      flickVelocity = flickVelocity * 0.6 + frameDelta * TOUCH_SENSITIVITY * 0.4;
      const c = Math.round(virtualIndex);
      if (c !== lastHapticCenter) { lastHapticCenter = c; hapticTick(); }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (!isTouching) return;
      isTouching = false;
      scrollVelocity = Math.abs(flickVelocity) > 0.03 ? flickVelocity : 0;
      flickVelocity = 0;
    }, { passive: true });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') scrollVelocity += 0.4;
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') scrollVelocity -= 0.4;
      if (e.key === 'e' || e.key === 'E') {
        const next = (currentEraIndex + 1) % eras.length;
        switchEra(next);
      }
    });

    infoEra.addEventListener('click', () => {
      const next = (currentEraIndex + 1) % eras.length;
      switchEra(next);
    });

    const eraLabels = document.querySelectorAll('.era-lbl');
    eraLabels.forEach(lbl => {
      lbl.addEventListener('click', () => {
        const idx = parseInt(lbl.dataset.era);
        if (idx !== currentEraIndex) switchEra(idx);
      });
    });

    const eraYear = document.getElementById('era-year');
    function updateEraBar() {
      eraLabels.forEach(l => l.classList.toggle('active', parseInt(l.dataset.era) === currentEraIndex));
      const c = currentComic();
      eraYear.textContent = c ? `${c.year} ${c.era}` : '';
    }

    const eraArrows = document.querySelectorAll('.era-arrow');
    setTimeout(() => { eraArrows.forEach(a => a.style.opacity = '0'); }, 5000);

    cardStack.style.transition = 'opacity .35s';
    initApp();
  </script>
</body>
</html>
