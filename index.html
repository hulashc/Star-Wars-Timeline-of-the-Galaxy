<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Star Wars Comics Deck</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --gold: #FFD700;
      --dark: #050509;
      --light-gold: #FFF4C4;
      --gold-dim: rgba(255, 215, 0, 0.25);
      --gold-faint: rgba(255, 215, 0, 0.55);
      --panel-bg: rgba(5, 5, 10, 0.92);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at top, #101018 0, #050509 55%);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      color: var(--gold);
    }

    /* ===== HEADER ===== */
    .header {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 1000;
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
      padding: 12px 20px;
      background: rgba(5, 5, 10, 0.78);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--gold-dim);
    }

    .tabs { display: flex; border: 1px solid var(--gold-dim); border-radius: 6px; overflow: hidden; flex-shrink: 0; }

    .tab {
      padding: 9px 28px; font-size: 12px; font-weight: 700;
      letter-spacing: 0.15em; text-transform: uppercase;
      cursor: pointer; border: none; background: transparent;
      color: rgba(255, 215, 0, 0.55);
      transition: color .25s, background .25s;
    }
    .tab.active { color: var(--gold); background: rgba(255, 215, 0, 0.08); }

    .header-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1; justify-content: flex-end; }

    .search-input {
      padding: 7px 12px; font-size: 12px; border-radius: 4px;
      border: 1px solid var(--gold-dim); background: rgba(255, 255, 255, 0.04);
      color: var(--light-gold); outline: none; width: 160px;
      font-family: inherit; transition: border-color .25s;
    }
    .search-input::placeholder { color: rgba(255, 215, 0, 0.35); }
    .search-input:focus { border-color: var(--gold); }

    .filter-select {
      padding: 7px 10px; font-size: 11px; border-radius: 4px;
      border: 1px solid var(--gold-dim); background: rgba(255, 255, 255, 0.04);
      color: var(--light-gold); outline: none; cursor: pointer;
      font-family: inherit; letter-spacing: 0.05em;
    }
    .filter-select option { background: #101018; color: var(--light-gold); }

    .scroll-hint {
      position: fixed; right: 28px; top: 50%; transform: translateY(-50%);
      writing-mode: vertical-rl;
      font-size: 10px; font-weight: 600; letter-spacing: 0.25em;
      text-transform: uppercase; color: rgba(255, 215, 0, 0.3);
      z-index: 500; animation: pulse 2.5s infinite;
      pointer-events: none;
    }
    @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: .75; } }

    /* ===== STAGE ===== */
    .stage {
      position: fixed; inset: 0;
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(320px, 400px);
      align-items: stretch;
      pointer-events: none;
      padding-top: 60px;
      padding-bottom: 85px;
    }

    .rolodex-container {
      position: relative; width: 100%; height: 100%;
      perspective: 1700px; perspective-origin: 50% 20%;
    }

    .card-stack {
      position: absolute; top: 52%; left: 50%;
      width: 36vw; max-width: 460px; height: 76vh;
      transform-style: preserve-3d;
      transform: translate(-50%, -50%);
    }

    .card {
      position: absolute; inset: 0;
      transform-style: preserve-3d;
      transform-origin: center center;
      will-change: transform, opacity;
      cursor: pointer;
    }

    .card-inner {
      width: 100%; height: 100%;
      border-radius: 4px;
      overflow: hidden; background: #050509;
      box-shadow: 0 32px 60px rgba(0,0,0,0.85);
      border: 1px solid var(--gold-dim);
      position: relative;
      transition: border-color .3s;
    }
    .card:hover .card-inner { border-color: var(--gold); }

    .card-inner img {
      width: 100%; height: 100%;
      object-fit: contain;
      filter: brightness(0.92) contrast(1.15);
      display: block;
    }

    .cover-fallback {
      width: 100%; height: 100%;
      display: flex; align-items: flex-end; justify-content: center;
      padding: 24px 34px;
      font-size: clamp(18px, 2vw, 28px); font-weight: 900;
      letter-spacing: .05em; text-transform: uppercase;
      color: var(--light-gold); text-shadow: 0 2px 12px rgba(0,0,0,0.9);
      position: relative;
    }
    .cover-fallback::before {
      content: ''; position: absolute; inset: 0;
      background: repeating-linear-gradient(
        45deg, transparent, transparent 2px,
        rgba(255,255,255,0.015) 2px, rgba(255,255,255,0.015) 4px
      );
    }



    /* ===== INFO PANEL ===== */
    .info-panel {
      position: relative; padding: 100px 36px 100px 20px;
      pointer-events: none; overflow-y: auto;
    }
    .info-card {
      position: sticky; top: 100px;
      pointer-events: auto;
      background: radial-gradient(circle at top, rgba(255,255,255,0.05), rgba(10,10,15,0.95));
      border: 1px solid var(--gold-dim);
      border-radius: 10px; padding: 20px 22px 22px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.9);
    }
    .info-era-pill {
      display: inline-flex; align-items: center;
      padding: 3px 10px; border-radius: 999px;
      border: 1px solid var(--gold-faint);
      font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
      margin-bottom: 12px; opacity: .9;
    }
    .info-title { font-size: 18px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 3px; }
    .info-subtitle { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .75; margin-bottom: 14px; }
    .info-meta { font-size: 11px; line-height: 1.7; opacity: .85; margin-bottom: 12px; }
    .info-meta strong { font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 10px; }
    .info-summary { font-size: 12px; line-height: 1.6; opacity: .8; }

    /* ===== TIMELINE ===== */
    .timeline {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 85px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--gold-dim);
      display: flex; align-items: center; justify-content: center;
      padding: 0 48px; z-index: 900;
    }
    .timeline-track {
      position: relative; width: 100%; max-width: 1500px; height: 2px;
      background: rgba(255, 215, 0, 0.18);
    }
    .timeline-track::before {
      content: ""; position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 2px; height: 28px;
      background: var(--gold); box-shadow: 0 0 10px rgba(255,215,0,.5);
    }
    .timeline-labels {
      position: absolute; width: 100%; top: -28px;
      display: flex; justify-content: space-between;
      font-size: 10px; font-weight: 600; letter-spacing: .12em;
      text-transform: uppercase; color: rgba(255, 215, 0, .5);
      pointer-events: none;
    }
    .timeline-marker {
      position: absolute; top: 50%; transform: translate(-50%, -50%);
      width: 14px; height: 14px;
      background: var(--gold); border-radius: 50%;
      border: 2.5px solid var(--dark);
      box-shadow: 0 0 18px rgba(255,215,0,.85);
      transition: left .4s cubic-bezier(.22,1,.36,1);
    }
    .timeline-year {
      position: absolute; top: 22px; left: 50%;
      transform: translateX(-50%);
      font-size: 13px; font-weight: 700; letter-spacing: .1em;
      white-space: nowrap; transition: opacity .3s;
    }
    .timeline-year.hidden { opacity: 0; }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 2000;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity .35s;
      padding: 20px;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }

    .modal-content {
      background: radial-gradient(circle at top, rgba(255,255,255,0.06), rgba(5,5,10,0.96));
      border: 1px solid var(--gold-dim);
      border-radius: 12px;
      max-width: 620px; width: 100%; max-height: 90vh;
      overflow-y: auto;
      display: flex; flex-direction: column;
      box-shadow: 0 40px 80px rgba(0,0,0,0.95);
      transform: scale(0.92) translateY(20px);
      transition: transform .35s cubic-bezier(.22,1,.36,1);
    }
    .modal-overlay.open .modal-content { transform: scale(1) translateY(0); }

    .modal-close {
      position: absolute; top: 12px; right: 14px;
      background: none; border: none; color: var(--gold);
      font-size: 22px; cursor: pointer; z-index: 10;
      opacity: .7; transition: opacity .2s; line-height: 1;
    }
    .modal-close:hover { opacity: 1; }

    .modal-image {
      width: 100%; height: 300px;
      clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%);
      position: relative; overflow: hidden;
      background: #050509;
    }
    .modal-image img {
      width: 100%; height: 100%; object-fit: contain; display: block;
    }
    .modal-image .cover-fallback {
      align-items: center; font-size: clamp(24px, 4vw, 36px);
      padding: 40px;
    }

    .modal-body { padding: 20px 24px 28px; position: relative; }
    .modal-era {
      display: inline-flex; align-items: center;
      padding: 3px 10px; border-radius: 999px;
      border: 1px solid var(--gold-faint);
      font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
      margin-bottom: 10px; opacity: .9;
    }
    .modal-title { font-size: 24px; font-weight: 900; letter-spacing: .05em; text-transform: uppercase; color: var(--light-gold); margin-bottom: 2px; }
    .modal-issue { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; opacity: .7; margin-bottom: 16px; }
    .modal-meta { font-size: 12px; line-height: 1.8; opacity: .85; margin-bottom: 16px; }
    .modal-meta strong { font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 11px; }
    .modal-summary { font-size: 13px; line-height: 1.7; opacity: .85; }

    .empty-state {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: rgba(255,215,0,0.4); font-size: 14px; letter-spacing: .1em;
      pointer-events: none; text-align: center;
    }



    /* ===== RESPONSIVE ===== */
    @media (max-width: 1024px) {
      .card-stack { width: 34vw; max-width: 360px; }
      .info-panel { padding: 80px 20px 80px 12px; }
      .header { padding: 10px 14px; gap: 8px; }
      .tab { padding: 8px 20px; font-size: 11px; }
      .search-input { width: 130px; }
    }

    @media (max-width: 768px) {
      .stage {
        grid-template-columns: 1fr;
        padding-bottom: 135px;
      }
      .info-panel {
        position: fixed; bottom: 50px; left: 0; right: 0;
        padding: 8px 14px; z-index: 800;
        background: rgba(5, 5, 10, 0.96);
        border-top: 1px solid var(--gold-dim);
        max-height: 110px;
      }
      .info-card {
        position: static; border: none; background: none;
        box-shadow: none; padding: 0; border-radius: 0;
      }
      .info-era-pill { margin-bottom: 6px; }
      .info-title { font-size: 14px; }
      .info-subtitle { font-size: 10px; margin-bottom: 4px; }
      .info-meta { display: none; }
      .info-summary { font-size: 11px; display: none; }

      .card-stack { width: 50vw; max-width: 320px; height: 55vh; }

      .timeline { height: 50px; padding: 0 20px; }
      .timeline-labels { font-size: 8px; top: -22px; }
      .timeline-marker { width: 11px; height: 11px; border-width: 2px; }
      .timeline-year { font-size: 11px; top: 16px; }
      .timeline-track::before { height: 20px; }

      .scroll-hint { display: none; }

      .header { padding: 8px 10px; gap: 6px; backdrop-filter: none; }
      .timeline { backdrop-filter: none; }
      .card-inner img { filter: none; }
      .tab { padding: 7px 14px; font-size: 10px; }
      .search-input { width: 100%; min-width: 0; }
      .filter-select { font-size: 10px; padding: 6px 8px; }
      .header-controls { justify-content: flex-start; }

      .modal-content { max-width: 100%; border-radius: 8px; }
      .modal-image { height: 200px; clip-path: polygon(0 0, 100% 0, 100% 90%, 0 100%); }
      .modal-body { padding: 16px 18px 22px; }
      .modal-title { font-size: 18px; }
    }

    @media (max-width: 480px) {
      .card-stack { width: 60vw; max-width: 280px; height: 48vh; }

      .header { backdrop-filter: none; }
      .timeline { backdrop-filter: none; }
      .info-panel { max-height: 90px; padding: 6px 12px; }
      .info-title { font-size: 13px; }
      .stage { padding-bottom: 125px; }
      .header-controls { flex-direction: column; align-items: stretch; gap: 4px; }
    }
  </style>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <div class="header">
    <div class="tabs">
      <button class="tab active" data-era="legends">Legends</button>
      <button class="tab" data-era="canon">Canon</button>
    </div>
    <div class="header-controls">
      <input class="search-input" id="search-input" type="text" placeholder="Search comics…" />
      <select class="filter-select" id="filter-publisher">
        <option value="all">All Publishers</option>
        <option value="Dark Horse Comics">Dark Horse</option>
        <option value="Marvel Comics">Marvel</option>
      </select>
      <select class="filter-select" id="sort-select">
        <option value="year-asc">Year ↑</option>
        <option value="year-desc">Year ↓</option>
        <option value="title-asc">Title A–Z</option>
        <option value="title-desc">Title Z–A</option>
      </select>
    </div>
  </div>

  <div class="scroll-hint">Scroll to explore</div>



  <!-- ===== STAGE ===== -->
  <div class="stage">
    <div class="rolodex-container">
      <div class="card-stack" id="card-stack"></div>
      <div class="empty-state" id="empty-state">No comics match your filter</div>
    </div>
    <aside class="info-panel">
      <div class="info-card">
        <div class="info-era-pill" id="info-era-pill"></div>
        <div class="info-title" id="info-title"></div>
        <div class="info-subtitle" id="info-subtitle"></div>
        <div class="info-meta" id="info-meta"></div>
        <div class="info-summary" id="info-summary"></div>
      </div>
    </aside>
  </div>

  <!-- ===== TIMELINE ===== -->
  <div class="timeline">
    <div class="timeline-track">
      <div class="timeline-labels">
        <span>26000 BBY</span>
        <span>150 ABY</span>
      </div>
      <div class="timeline-marker" id="timeline-marker">
        <div class="timeline-year" id="timeline-year">0 ABY</div>
      </div>
    </div>
  </div>

  <!-- ===== MODAL ===== -->
  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <button class="modal-close" id="modal-close">&times;</button>
      <div class="modal-image" id="modal-image"></div>
      <div class="modal-body">
        <div class="modal-era" id="modal-era"></div>
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-issue" id="modal-issue"></div>
        <div class="modal-meta" id="modal-meta"></div>
        <div class="modal-summary" id="modal-summary"></div>
      </div>
    </div>
  </div>

  <script src="comics.js"></script>
  <script>
    /* ==========================================================
       SECTION 1: DATA — loaded from comics.js via <script> tag
       ========================================================== */

    /* ==========================================================
       SECTION 2: STATE & DOM REFS
       ========================================================== */

    const WINDOW_RADIUS = window.innerWidth < 768 ? 4 : 7;
    const IS_MOBILE = window.innerWidth < 768;

    let loadedData = null;
    let currentEra = localStorage.getItem('sw-era') || 'legends';
    let virtualIndex = parseFloat(localStorage.getItem('sw-index')) || 0;
    let searchTerm = '';
    let publisherFilter = 'all';
    let sortBy = localStorage.getItem('sw-sort') || 'year-asc';
    let filteredData = [];
    let cards = [];
    let maxIndex = 0;
    let animating = true;
    let searchTimer = null;

    const cardStack = document.getElementById('card-stack');
    const tabs = document.querySelectorAll('.tab');
    const timelineMarker = document.getElementById('timeline-marker');
    const timelineYear = document.getElementById('timeline-year');
    const infoEra = document.getElementById('info-era-pill');
    const infoTitle = document.getElementById('info-title');
    const infoSub = document.getElementById('info-subtitle');
    const infoMeta = document.getElementById('info-meta');
    const infoSummary = document.getElementById('info-summary');
    const searchInput = document.getElementById('search-input');
    const filterPublisher = document.getElementById('filter-publisher');
    const sortSelect = document.getElementById('sort-select');
    const emptyState = document.getElementById('empty-state');
    const modal = document.getElementById('modal');
    const modalClose = document.getElementById('modal-close');
    const modalImage = document.getElementById('modal-image');
    const modalEra = document.getElementById('modal-era');
    const modalTitle = document.getElementById('modal-title');
    const modalIssue = document.getElementById('modal-issue');
    const modalMeta = document.getElementById('modal-meta');
    const modalSummary = document.getElementById('modal-summary');

    /* ==========================================================
       SECTION 3: HELPERS
       ========================================================== */

    function slugify(text) {
      return text.toLowerCase()
        .replace(/[^\w\s'-]/g, '')
        .replace(/[\s-]+/g, '-')
        .replace(/^-|-$/g, '');
    }

    function getAbsoluteYear(c) {
      return c.era === 'BBY' ? -c.year : c.year;
    }

    function getFallbackStyle(title) {
      let hash = 0;
      for (let i = 0; i < title.length; i++) {
        hash = title.charCodeAt(i) + ((hash << 5) - hash);
      }
      const hue = Math.abs(hash % 360);
      return `linear-gradient(135deg, hsl(${hue}, 55%, 14%), hsl(${(hue + 40) % 360}, 50%, 7%))`;
    }

    function handleImageError(img, alt) {
      if (img.dataset.fallback === 'true') return;
      img.dataset.fallback = 'true';
      img.style.display = 'none';
      const fb = document.createElement('div');
      fb.className = 'cover-fallback';
      fb.style.background = getFallbackStyle(alt);
      fb.textContent = alt;
      img.parentNode.insertBefore(fb, img);
    }

    function coverSlug(comic) {
      return slugify(comic.title + ' ' + comic.issue);
    }
    function createCoverImage(comic, container) {
      const img = document.createElement('img');
      const slug = coverSlug(comic);
      img.src = `covers/${slug}.jpg`;
      img.alt = comic.title;
      img.loading = 'lazy';
      img.onerror = function () { handleImageError(this, comic.title); };
      container.appendChild(img);
    }

    function getTimelinePosition(c) {
      const minYear = -26000;
      const maxYear = 150;
      const range = maxYear - minYear;
      const abs = getAbsoluteYear(c);
      return ((abs - minYear) / range) * 100;
    }

    /* ==========================================================
       SECTION 4: DATA LOADING + FILTERING
       ========================================================== */

    function initApp() {
      loadedData = COMICS_DATA;
      reapplyFilters();
      requestAnimationFrame(animate);
    }

    function getFilteredData() {
      let data = [...loadedData[currentEra]];

      if (searchTerm) {
        const t = searchTerm.toLowerCase();
        data = data.filter(c =>
          c.title.toLowerCase().includes(t) ||
          c.issue.toLowerCase().includes(t) ||
          c.publisher.toLowerCase().includes(t) ||
          c.note.toLowerCase().includes(t)
        );
      }

      if (publisherFilter !== 'all') {
        data = data.filter(c => c.publisher === publisherFilter);
      }

      const sortFns = {
        'year-asc': (a, b) => getAbsoluteYear(a) - getAbsoluteYear(b),
        'year-desc': (a, b) => getAbsoluteYear(b) - getAbsoluteYear(a),
        'title-asc': (a, b) => a.title.localeCompare(b.title),
        'title-desc': (a, b) => b.title.localeCompare(a.title)
      };
      if (sortFns[sortBy]) data.sort(sortFns[sortBy]);

      return data;
    }

    /* ==========================================================
       SECTION 5: VIRTUAL WINDOW RENDERING
       ========================================================== */

    function createCardElement(comic, index) {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.index = index;

      const inner = document.createElement('div');
      inner.className = 'card-inner';
      createCoverImage(comic, inner);
      card.appendChild(inner);
      card.addEventListener('click', () => openModal(comic));
      cardStack.appendChild(card);
      return card;
    }

    function renderWindow() {
      const center = Math.round(virtualIndex);
      const start = Math.max(0, center - WINDOW_RADIUS);
      const end = Math.min(filteredData.length - 1, center + WINDOW_RADIUS);

      if (filteredData.length === 0) {
        cardStack.innerHTML = '';
        emptyState.style.display = 'block';
        cards = [];
        maxIndex = 0;
        return;
      }
      emptyState.style.display = 'none';

      const existing = new Set();
      Array.from(cardStack.children).forEach(el => {
        const idx = parseInt(el.dataset.index);
        if (idx >= start && idx <= end) {
          existing.add(idx);
        } else {
          el.remove();
        }
      });

      for (let i = start; i <= end; i++) {
        if (existing.has(i)) continue;
        createCardElement(filteredData[i], i);
      }

      const children = Array.from(cardStack.children)
        .sort((a, b) => parseInt(a.dataset.index) - parseInt(b.dataset.index));
      children.forEach((el, i) => { el.style.zIndex = children.length - i; });
      cards = children;
      maxIndex = filteredData.length - 1;
    }

    function reapplyFilters() {
      filteredData = getFilteredData();
      if (virtualIndex > filteredData.length - 1) virtualIndex = 0;
      if (virtualIndex < 0) virtualIndex = 0;
      lastRenderedCenter = -1;
      renderWindow();
      updateInfo();
      updateTimeline();
    }

    /* ==========================================================
       SECTION 6: TIMELINE
       ========================================================== */

    function currentComic() {
      const idx = Math.round(virtualIndex);
      return filteredData[idx] || filteredData[filteredData.length - 1] || null;
    }

    function updateTimeline() {
      const c = currentComic();
      if (!c) return;
      const pos = getTimelinePosition(c);
      timelineMarker.style.left = `${Math.max(0, Math.min(100, pos))}%`;
      timelineYear.textContent = `${c.year} ${c.era}`;
    }

    /* ==========================================================
       SECTION 7: INFO PANEL
       ========================================================== */

    function updateInfo() {
      const c = currentComic();
      if (!c) {
        infoEra.textContent = '';
        infoTitle.textContent = 'No results';
        infoSub.textContent = '';
        infoMeta.innerHTML = '';
        infoSummary.textContent = 'Try adjusting your search or filter.';
        return;
      }
      infoEra.textContent = `${currentEra.toUpperCase()} · ${c.year} ${c.era}`;
      infoTitle.textContent = c.title;
      infoSub.textContent = c.issue;
      infoMeta.innerHTML = `
        <div><strong>PUBLISHER</strong> · ${c.publisher}</div>
        <div><strong>FORMAT</strong> · ${c.format}</div>
        <div><strong>RELEASE</strong> · ${c.release}</div>
        <div><strong>TIMELINE</strong> · ${c.year} ${c.era}</div>
      `;
      infoSummary.textContent = c.note;
    }

    /* ==========================================================
       SECTION 8: MODAL
       ========================================================== */

    function openModal(comic) {
      animating = false;

      modalImage.innerHTML = '';
      createCoverImage(comic, modalImage);

      modalEra.textContent = `${currentEra.toUpperCase()} · ${comic.year} ${comic.era}`;
      modalTitle.textContent = comic.title;
      modalIssue.textContent = comic.issue;
      modalMeta.innerHTML = `
        <div><strong>PUBLISHER</strong> · ${comic.publisher}</div>
        <div><strong>FORMAT</strong> · ${comic.format}</div>
        <div><strong>RELEASE</strong> · ${comic.release}</div>
        <div><strong>TIMELINE</strong> · ${comic.year} ${comic.era}</div>
      `;
      modalSummary.textContent = comic.note;

      modal.classList.add('open');
    }

    function closeModal() {
      modal.classList.remove('open');
      animating = true;
    }

    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('open')) closeModal(); });

    /* ==========================================================
       SECTION 9: SEARCH, FILTER & SORT
       ========================================================== */

    function applyFilters() {
      searchTerm = searchInput.value;
      publisherFilter = filterPublisher.value;
      sortBy = sortSelect.value;
      localStorage.setItem('sw-sort', sortBy);
      reapplyFilters();
    }

    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(applyFilters, 120);
    });
    filterPublisher.addEventListener('change', applyFilters);
    sortSelect.addEventListener('change', applyFilters);

    /* ==========================================================
       SECTION 10: INPUT HANDLING
       ========================================================== */

    let scrollVelocity = 0;

    window.addEventListener('wheel', (e) => {
      scrollVelocity += e.deltaY * 0.002;
    }, { passive: true });

    let touchStartY = 0;
    window.addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0].clientY;
    }, { passive: true });
    window.addEventListener('touchend', (e) => {
      const d = touchStartY - e.changedTouches[0].clientY;
      scrollVelocity += d * 0.004;
    }, { passive: true });

    window.addEventListener('keydown', (e) => {
      if (document.activeElement === searchInput) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') scrollVelocity += 0.4;
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') scrollVelocity -= 0.4;
    });

    /* ==========================================================
       SECTION 11: ANIMATION LOOP
       ========================================================== */

    let lastRenderedCenter = -1;

    function animate() {
      if (!animating) {
        requestAnimationFrame(animate);
        return;
      }

      scrollVelocity *= 0.9;
      if (Math.abs(scrollVelocity) < 0.001) scrollVelocity = 0;
      virtualIndex += scrollVelocity;
      virtualIndex = Math.max(0, Math.min(maxIndex, virtualIndex));

      const snapTarget = Math.round(virtualIndex);
      virtualIndex += (snapTarget - virtualIndex) * (IS_MOBILE ? 0.15 : 0.08);

      const center = Math.round(virtualIndex);
      if (center !== lastRenderedCenter) {
        lastRenderedCenter = center;
        renderWindow();
      }

      const baseTilt = -18;
      const deckSpreadZ = 28;
      const deckSpreadY = -6;

      cards.forEach(card => {
        const i = parseInt(card.dataset.index);
        const offset = i - virtualIndex;
        let rotateX, translateY, translateZ, opacity;

        if (offset < -1.2) {
          rotateX = 90; translateY = 520; translateZ = -280; opacity = 0;
        } else if (offset < 0) {
          const t = 1 + offset;
          rotateX = baseTilt + (1 - t) * 110;
          translateY = t * -24 + (1 - t) * 280;
          translateZ = t * 90 + (1 - t) * -220;
          opacity = t;
        } else {
          const depth = Math.min(offset, 6);
          translateZ = -depth * deckSpreadZ;
          translateY = depth * deckSpreadY;
          rotateX = baseTilt;
          opacity = 1 - depth * 0.12;

          if (offset < 0.5) {
            const lift = (0.5 - offset) * 2;
            translateZ += lift * 70;
            translateY -= lift * 18;
          }
        }

        card.style.transform = `rotateX(${rotateX}deg) translateZ(${translateZ}px) translateY(${translateY}px)`;
        card.style.opacity = opacity;
      });

      updateTimeline();
      updateInfo();
      if (Math.abs(scrollVelocity) < 0.01 && Math.abs(virtualIndex - Math.round(virtualIndex)) < 0.01) {
        localStorage.setItem('sw-index', Math.round(virtualIndex));
      }
      requestAnimationFrame(animate);
    }

    /* ==========================================================
       SECTION 12: ERA TABS
       ========================================================== */

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const era = tab.getAttribute('data-era');
        if (era === currentEra || !loadedData) return;
        const prev = currentEra;
        currentEra = era;
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        virtualIndex = 0;
        scrollVelocity = 0;
        localStorage.setItem('sw-era', currentEra);
        cardStack.style.opacity = '0.3';
        reapplyFilters();
        requestAnimationFrame(() => { cardStack.style.opacity = ''; });
      });
    });

    /* ==========================================================
       SECTION 13: STATE PERSISTENCE
       ========================================================== */

    function restoreState() {
      const savedEra = localStorage.getItem('sw-era');
      const savedSort = localStorage.getItem('sw-sort');
      if (savedEra && (savedEra === 'legends' || savedEra === 'canon')) {
        currentEra = savedEra;
        tabs.forEach(t => {
          t.classList.toggle('active', t.getAttribute('data-era') === savedEra);
        });
      }
      if (savedSort) {
        sortBy = savedSort;
        sortSelect.value = savedSort;
      }
    }

    /* ==========================================================
       SECTION 14: INIT
       ========================================================== */

    restoreState();
    cardStack.style.transition = 'opacity .35s';
    initApp();
  </script>
</body>
</html>
