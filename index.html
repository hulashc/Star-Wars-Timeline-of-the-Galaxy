<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Star Wars Comics Deck</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="era-bar" id="era-bar">
    <span class="era-arrow" id="era-arrow-l">◀</span>
    <span class="era-lbl" data-era="0">Legends</span>
    <span class="sep">|</span>
    <span class="era-lbl" data-era="1">Canon</span>
    <span class="era-arrow" id="era-arrow-r">▶</span>
    <span class="yr" id="era-year"></span>
  </div>

  <aside class="info-panel">
    <div class="info-card">
      <div class="info-era-pill" id="info-era-pill"></div>
      <div class="info-title" id="info-title"></div>
      <div class="info-subtitle" id="info-subtitle"></div>
      <div class="info-meta" id="info-meta"></div>
      <div class="info-summary" id="info-summary"></div>
    </div>
  </aside>

  <button class="arc-nav-toggle" id="arc-nav-toggle" aria-label="Browse by story arc" aria-expanded="false">&#9776;</button>
  <nav class="arc-nav" id="arc-nav" aria-hidden="true">
    <div class="arc-nav-list" id="arc-nav-list"></div>
  </nav>

  <!-- ===== STAGE ===== -->
  <div class="stage">
    <div class="rolodex-container">
      <div class="card-stack" id="card-stack"></div>
    </div>
  </div>

  <!-- ===== MODAL ===== -->
  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <button class="modal-close" id="modal-close">&times;</button>
      <div class="modal-image" id="modal-image"></div>
      <div class="modal-body">
        <div class="modal-era" id="modal-era"></div>
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-issue" id="modal-issue"></div>
        <div class="modal-meta" id="modal-meta"></div>
        <div class="modal-summary" id="modal-summary"></div>
      </div>
    </div>
  </div>

  <script src="comics.js"></script>
  <script src="app.js"></script>
</body>
</html>
